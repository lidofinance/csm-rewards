---
name: Check CSM rewards tree

on:
  workflow_call:
    inputs:
      chain:
        description: Chain to run the script on
        required: true
        type: string
      distributor:
        description: CSFeeDistributor address
        required: true
        type: string
      notify:
        description: Notify the test results to a Discord channel
        required: false
        default: false
        type: boolean
      source_repository:
        description: Repository with the script and Python project to run
        required: false
        type: string
      source_ref:
        description: Git ref in source_repository to check out
        required: false
        type: string

jobs:
  script:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12.4"
    steps:
      - name: Setup RPC URL
        run: |
          echo "::add-mask::$RPC_URL"
          echo "RPC_URL=$RPC_URL" >> "$GITHUB_ENV"
        env:
          RPC_URL: ${{ inputs.chain == 'hoodi' && secrets.RPC_URL_HOODI || secrets.RPC_URL_MAINNET }}

      - name: Setup Discord Webhook URL
        run: |
          echo "::add-mask::$DISCORD_WEBHOOK"
          echo "DISCORD_WEBHOOK=$DISCORD_WEBHOOK" >> "$GITHUB_ENV"
        env:
          DISCORD_WEBHOOK: ${{ inputs.chain == 'hoodi' && secrets.DISCORD_WEBHOOK_HOODI || secrets.DISCORD_WEBHOOK_MAINNET }}

      - name: Setup IPFS gateway URL
        run: |
          echo "::add-mask::$IPFS_GATEWAY"
          echo "IPFS_GATEWAY=$IPFS_GATEWAY" >> "$GITHUB_ENV"
        env:
          IPFS_GATEWAY: ${{ secrets.IPFS_GATEWAY }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref || 'action' }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        run: python -m pip install uv==0.11.8

      - name: Install dependencies
        run: uv sync --locked --python "$PYTHON_VERSION"

      - name: Generate types
        run: uv run wake up pytypes

      - name: Run checks
        run: uv run wake run --silent check.py
        env:
          RPC_URL: ${{ env.RPC_URL }}
          IPFS_GATEWAY: ${{ env.IPFS_GATEWAY }}
          DISTRIBUTOR_ADDRESS: ${{ inputs.distributor }}

      - name: Echo embeds to the env variable
        if: ${{ failure() && (github.event_name == 'schedule' || inputs.notify) }}
        run: |
          EMBEDS=$(cat <<EOF
          [
            {
              "title": "Reward trees checks have failed! :scream:",
              "url": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
              "description": "Check the logs for more information."
            }
          ]
          EOF
          )
          EMBEDS=$(echo "$EMBEDS" | jq -c .) # Compact JSON representation
          echo "EMBEDS=$EMBEDS" >> "$GITHUB_ENV"

      - name: Discord notification when fails
        if: ${{ failure() && (github.event_name == 'schedule' || inputs.notify) }}
        uses: lidofinance/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: ${{ env.EMBEDS }}
