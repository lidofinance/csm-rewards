---
name: Update CSM rewards tree

on:
  workflow_call:
    inputs:
      chain:
        description: Branch to commit the updated artifacts to
        required: true
        type: string
      distributor:
        description: CSFeeDistributor address
        required: true
        type: string
      source_repository:
        description: Repository with the script and Python project to run
        required: false
        type: string
      source_ref:
        description: Git ref in source_repository to check out
        required: false
        type: string
permissions:
  contents: write

jobs:
  script:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12.4"
    steps:
      - name: Setup RPC URL
        run: |
          echo "::add-mask::$RPC_URL"
          echo "RPC_URL=$RPC_URL" >> "$GITHUB_ENV"
        env:
          RPC_URL: ${{ inputs.chain == 'hoodi' && secrets.RPC_URL_HOODI || secrets.RPC_URL_MAINNET }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref || 'action' }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        run: python -m pip install uv==0.11.8

      - name: Install dependencies
        run: uv sync --locked --python "$PYTHON_VERSION"

      - name: Generate types
        run: uv run wake up pytypes

      - name: Run script
        run: |
          uv run wake run main.py
          mkdir -p /tmp/artifacts && mv ./*.json /tmp/artifacts
        id: script
        env:
          RPC_URL: ${{ env.RPC_URL }}
          DISTRIBUTOR_ADDRESS: ${{ inputs.distributor }}

      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ inputs.chain }}

      - name: Commit new artifacts
        run: |
          mv /tmp/artifacts/* .
          git diff --exit-code --quiet tree.json && { echo "nothing to commit"; exit 0; }
          git add "*.json"
          git config --global user.name "madlabman"
          git config --global user.email "10616301+madlabman@users.noreply.github.com"
          git commit -m "chore: update tree and proofs" -m "CID: ${{ steps.script.outputs.cid }}"
          git fetch origin
          git rebase --strategy-option=ours "origin/${{ inputs.chain }}"
          git push
